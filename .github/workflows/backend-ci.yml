name: Backend checks
on:
  push:
    paths: ["backend/**", "tests/**", "pyproject.toml", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", "tests/**", "pyproject.toml", ".github/workflows/backend-ci.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
